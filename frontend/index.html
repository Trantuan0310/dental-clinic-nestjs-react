<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2BA3A0" />
    <meta name="description" content="%CLINIC_NAME%: khám, tư vấn và điều trị răng miệng cho cả gia đình. Xem bảng giá và đặt lịch khám online." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="%CLINIC_NAME% — Đặt lịch khám răng online" />
    <meta property="og:description" content="Khám, tư vấn và điều trị răng miệng cho cả gia đình. Xem bảng giá và đặt lịch khám online." />
    <title>%CLINIC_NAME% — Đặt lịch khám răng online</title>
    <script>
      // Apply stored theme before React mounts to avoid flash of wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('gensmile.theme');
          var mode = raw ? (JSON.parse(raw).state && JSON.parse(raw).state.mode) || 'light' : 'light';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) { /* noop */ }
      })();
    </script>
  </head>
  <body class="bg-surface-50 text-surface-900 antialiased dark:bg-surface-950 dark:text-surface-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
