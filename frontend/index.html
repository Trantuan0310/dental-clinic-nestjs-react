<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2BA3A0" />
    <meta name="description" content="Nha khoa GENSMILE: khám, tư vấn và điều trị răng miệng cho cả gia đình. Xem bảng giá và đặt lịch khám online." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Nha khoa GENSMILE — Đặt lịch khám răng online" />
    <meta property="og:description" content="Khám, tư vấn và điều trị răng miệng cho cả gia đình. Xem bảng giá và đặt lịch khám online." />
    <title>Nha khoa GENSMILE — Đặt lịch khám răng online</title>
    <script>
      // Apply stored theme before React mounts to avoid flash of wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('gensmile.theme');
          var mode = raw ? (JSON.parse(raw).state && JSON.parse(raw).state.mode) || 'light' : 'light';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) { /* noop */ }
      })();
    </script>
  </head>
  <body class="bg-surface-50 text-surface-900 antialiased dark:bg-surface-950 dark:text-surface-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
