<!--
  Favicon — derived from logo-icon.svg, simplified for 16/32/64 px rendering.
  Uses currentColor + a default teal so the favicon brand-matches the page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .fav-bg     { fill: #2BA3A0; }
      .fav-stroke { fill: none; stroke: #FFFFFF; stroke-width: 1.4; stroke-linecap: round; opacity: 0.85; }
      .fav-spark  { fill: #F4B860; }
    </style>
  </defs>

  <rect width="32" height="32" rx="6" fill="#E6FAF8"/>

  <!-- Tooth -->
  <path class="fav-bg"
        d="M 16 4
           C 22 4, 27 7, 28 11
           C 29 16, 27 22, 24 26
           C 22 28.5, 19 30, 16 30
           C 13 30, 10 28.5, 8 26
           C 5 22, 3 16, 4 11
           C 5 7, 10 4, 16 4 Z"/>

  <!-- Gloss highlight -->
  <path class="fav-stroke"
        d="M 11 9 C 13 10, 15 12, 16 14 C 17 16, 17 18, 16 20"/>

  <!-- Sparkle -->
  <g transform="translate(6,6)">
    <path class="fav-spark" d="M 0 -2.5 L 0.7 -0.7 L 2.5 0 L 0.7 0.7 L 0 2.5 L -0.7 0.7 L -2.5 0 L -0.7 -0.7 Z"/>
  </g>
</svg>
