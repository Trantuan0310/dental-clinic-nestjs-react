# Production deploy: after CI passes on main, SSH into the VPS and run
# scripts/deploy-vps.sh (backup -> checkout -> build -> migrate -> restart ->
# health check). Can also be started by hand from the Actions tab.
#
# Secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY (see
# docs/08_Deployment/AUTO_DEPLOY.md).
name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cut one off in the middle of a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 35m
          script: |
            set -e
            cd /opt/dental-clinic/production
            git fetch origin
            git show origin/main:scripts/deploy-vps.sh > /tmp/deploy-vps.sh
            bash /tmp/deploy-vps.sh origin/main
