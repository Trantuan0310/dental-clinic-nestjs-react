services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set local PostgreSQL database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set local PostgreSQL user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/server.key
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${POSTGRES_CERT_DIR:?Set PostgreSQL certificate directory}:/var/lib/postgresql/certs:ro
      - ./backend/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./backend/02-uuid-v7.sql:/docker-entrypoint-initdb.d/02-uuid-v7.sql:ro
      - ./backend/03-sequences.sql:/docker-entrypoint-initdb.d/03-sequences.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bootstrap:
    profiles: [bootstrap]
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "node_modules/ts-node/dist/bin.js", "--transpile-only", "prisma/seed.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runner
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      JWT_SECRET: ${JWT_SECRET:?Set random JWT secret}
      CORS_ORIGIN: https://${DOMAIN:?Set public domain}
      FRONTEND_URL: https://${DOMAIN}
      PUBLIC_APP_URL: https://${DOMAIN}
      TRUST_PROXY: '1'
      EMAIL_MOCK: ${EMAIL_MOCK:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@gensmile.online}
      BOOKING_NOTIFY_EMAILS: ${BOOKING_NOTIFY_EMAILS:-}
      BOOKING_MIN_LEAD_MIN: ${BOOKING_MIN_LEAD_MIN:-120}
      # Online booking horizon in days; slot grid step in minutes (see .env example).
      BOOKING_MAX_DAYS_AHEAD: ${BOOKING_MAX_DAYS_AHEAD:-60}
      SLOT_STEP_MIN: ${SLOT_STEP_MIN:-15}
      REDIS_URL: ${REDIS_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_FORMAT: ${AI_API_FORMAT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: https://${DOMAIN}
        VITE_CLINIC_NAME: ${CLINIC_NAME:-}
        VITE_CLINIC_TAGLINE: ${CLINIC_TAGLINE:-}
        VITE_CLINIC_PHONE: ${CLINIC_PHONE:-}
        VITE_CLINIC_ZALO: ${CLINIC_ZALO:-}
        VITE_CLINIC_EMAIL: ${CLINIC_EMAIL:-}
        VITE_CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
        VITE_CLINIC_MAP_URL: ${CLINIC_MAP_URL:-}
        VITE_CLINIC_FACEBOOK_URL: ${CLINIC_FACEBOOK_URL:-}
        VITE_CLINIC_HOURS: ${CLINIC_HOURS:-}
        VITE_CLINIC_SUNDAY_HOURS: ${CLINIC_SUNDAY_HOURS:-}
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ${TLS_CERT_DIR:?Set certificate directory}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: