services:
  bootstrap:
    profiles: [bootstrap]
    build:
      context: ./backend
      target: migrate
    command: ["node", "node_modules/ts-node/dist/bin.js", "--transpile-only", "prisma/seed.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set TLS migration database URL}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    restart: "no"
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set TLS migration database URL}
    restart: "no"
  backend:
    build:
      context: ./backend
      target: runner
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set TLS application database URL}
      JWT_SECRET: ${JWT_SECRET:?Set random JWT secret}
      CORS_ORIGIN: https://${DOMAIN:?Set public domain}
      FRONTEND_URL: https://${DOMAIN}
      # Root of the links in patient booking emails.
      PUBLIC_APP_URL: https://${DOMAIN}
      TRUST_PROXY: '1'
      EMAIL_MOCK: 'false'
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP user}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP password}
      EMAIL_FROM: ${EMAIL_FROM:?Set sender email}
      BOOKING_NOTIFY_EMAILS: ${BOOKING_NOTIFY_EMAILS:-}
      # Patient emails: clinic hotline in every email; visit cancel/move/reminder switch.
      CLINIC_NAME: ${CLINIC_NAME:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
      APPOINTMENT_EMAIL_NOTICES: ${APPOINTMENT_EMAIL_NOTICES:-true}
      BOOKING_MIN_LEAD_MIN: ${BOOKING_MIN_LEAD_MIN:-120}
      # Hours before a confirmed visit the patient may still cancel it from the email link.
      BOOKING_PATIENT_CANCEL_MIN_HOURS: ${BOOKING_PATIENT_CANCEL_MIN_HOURS:-4}
      # Online booking horizon in days; slot grid step in minutes (see .env example).
      BOOKING_MAX_DAYS_AHEAD: ${BOOKING_MAX_DAYS_AHEAD:-60}
      SLOT_STEP_MIN: ${SLOT_STEP_MIN:-15}
      REDIS_URL: ${REDIS_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_FORMAT: ${AI_API_FORMAT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: https://${DOMAIN}
        VITE_CLINIC_NAME: ${CLINIC_NAME:-}
        VITE_CLINIC_TAGLINE: ${CLINIC_TAGLINE:-}
        VITE_CLINIC_PHONE: ${CLINIC_PHONE:-}
        VITE_CLINIC_ZALO: ${CLINIC_ZALO:-}
        VITE_CLINIC_EMAIL: ${CLINIC_EMAIL:-}
        VITE_CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
        VITE_CLINIC_MAP_URL: ${CLINIC_MAP_URL:-}
        VITE_CLINIC_FACEBOOK_URL: ${CLINIC_FACEBOOK_URL:-}
        VITE_CLINIC_HOURS: ${CLINIC_HOURS:-}
        VITE_CLINIC_SUNDAY_HOURS: ${CLINIC_SUNDAY_HOURS:-}
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ${TLS_CERT_DIR:?Set certificate directory}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
