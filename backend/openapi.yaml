        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dueDate:
                  type: string
                  format: date
                notes:
                  type: string
                discountCents:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Invoice updated
        "409":
