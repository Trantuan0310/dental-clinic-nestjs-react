          in: query
          schema:
            type: string
            enum: [draft, issued, partial, paid, void]
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
        - name: encounterId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: minOutstandingCents
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: issuedAt:desc
      responses:
        "200":
          description: Invoice list
          content:
