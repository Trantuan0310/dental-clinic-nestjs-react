        - name: dentistId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, closed, cancelled]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: startedAt:desc
      responses:
        "200":
          description: Encounter list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Encounter'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Encounters]
      summary: Create walk-in encounter (usually done via appointment start)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEncounterRequest'
      responses:
        "201":
          description: Encounter created

  /encounters/{id}:
    get:
      tags: [Encounters]
      summary: Get encounter by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Encounter detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Encounter'
    patch:
      tags: [Encounters]
      summary: Update encounter (chiefComplaint, diagnosis — only while in_progress)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chiefComplaint:
                  type: string
                diagnosis:
                  type: string
      responses:
        "200":
          description: Encounter updated
        "409":
          description: Encounter is locked (already closed)

  /encounters/{id}/close:
    post:
      tags: [Encounters]
      summary: Close encounter (ATOMIC: close + stock-out + auto invoice draft)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseEncounterRequest'
      responses:
        "200":
          description: Encounter closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloseEncounterResponse'
        "422":
          description: No clinical note or treatments, or missing treatment prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /encounters/{id}/cancel:
    post:
      tags: [Encounters]
      summary: Cancel encounter (usually cascade from appointment cancel)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Encounter cancelled
        "409":
          description: Cannot cancel closed encounter

