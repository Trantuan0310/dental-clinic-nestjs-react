components:
  schemas:
    PayrollConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        payrollCycle:
          type: string
          enum: [WEEKLY, BIWEEKLY, MONTHLY]
        overtimeMultiplier: { type: number, format: decimal }
        defaultTaxTncnPct: { type: number, format: decimal }
        bhxhPct: { type: number, format: decimal }
        bhytPct: { type: number, format: decimal }
        bhtnPct: { type: number, format: decimal }
        minGrossForBhxh: { type: integer, format: int64 }
        probationSalaryPct: { type: number, format: decimal }
        taxBrackets:
          type: object
          properties:
            personalDeductionVnd: { type: integer, format: int64 }
            brackets:
              type: array
              items:
                type: object
                properties:
                  thresholdVnd: { type: integer, format: int64, nullable: true }
                  rate: { type: number, format: decimal }
        updatedAt: { type: string, format: date-time }

    PayrollConfigUpdateRequest:
      type: object
      required: [payrollCycle, overtimeMultiplier, bhxhPct, bhytPct, bhtnPct, minGrossForBhxh, taxBrackets]
      properties:
        payrollCycle: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY] }
        overtimeMultiplier: { type: number, format: decimal }
        bhxhPct: { type: number, format: decimal }
        bhytPct: { type: number, format: decimal }
        bhtnPct: { type: number, format: decimal }
        minGrossForBhxh: { type: integer, format: int64 }
        taxBrackets:
          type: object

    DentistCompensation:
      type: object
      properties:
        id: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        baseSalaryVnd: { type: integer, format: int64 }
        commissionPct: { type: number, format: decimal }
        overtimeHourlyVnd: { type: integer, format: int64 }
        notes: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }

    CreateCompensationRequest:
      type: object
      required: [dentistId, effectiveFrom, baseSalaryVnd, commissionPct]
      properties:
        dentistId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        baseSalaryVnd: { type: integer, format: int64, minimum: 0 }
        commissionPct: { type: number, format: decimal, minimum: 0, maximum: 1 }
        overtimeHourlyVnd: { type: integer, format: int64, minimum: 0 }
        notes: { type: string, maxLength: 1000 }

    UpdateCompensationRequest:
      type: object
      properties:
        effectiveTo: { type: string, format: date }
        baseSalaryVnd: { type: integer, format: int64, minimum: 0 }
        commissionPct: { type: number, format: decimal, minimum: 0, maximum: 1 }
        overtimeHourlyVnd: { type: integer, format: int64, minimum: 0 }
        notes: { type: string, maxLength: 1000 }

    PayrollPeriod:
      type: object
      properties:
        id: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        payrollCycle: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY] }
        status: { type: string, enum: [DRAFT, REVIEWING, APPROVED, PAID, LOCKED] }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: string, format: date-time, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        paymentReference: { type: string, nullable: true }

    CreatePayrollPeriodRequest:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }

    PayrollPeriodDetail:
      allOf:
        - $ref: '#/components/schemas/PayrollPeriod'
        - type: object
          properties:
            lineItems:
              type: array
              items:
                $ref: '#/components/schemas/PayrollLineItem'
            summary:
              type: object
              properties:
                totalGrossPayVnd: { type: integer, format: int64 }
                totalNetPayVnd: { type: integer, format: int64 }
                totalEncounters: { type: integer }

    PayrollLineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        payrollPeriodId: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        dentistName: { type: string }
        encountersCount: { type: integer }
        totalRevenueVnd: { type: integer, format: int64 }
        workedShifts: { type: integer }
        totalHours: { type: number, format: decimal }
        overtimeHours: { type: number, format: decimal }
        baseSalaryVnd: { type: integer, format: int64 }
        commissionVnd: { type: integer, format: int64 }
        overtimePayVnd: { type: integer, format: int64 }
        bonusVnd: { type: integer, format: int64 }
        penaltyVnd: { type: integer, format: int64 }
        grossPayVnd: { type: integer, format: int64 }
        taxTncnVnd: { type: integer, format: int64 }
        bhxhVnd: { type: integer, format: int64 }
        netPayVnd: { type: integer, format: int64 }
        manuallyAdjusted: { type: boolean }
        computationLog:
          type: object
          additionalProperties: true
        computedAt: { type: string, format: date-time }

    PayrollComputeResult:
      type: object
      properties:
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/PayrollLineItem'
        summary:
          type: object

    AddAdjustmentRequest:
      type: object
      required: [lineItemId, type, amountVnd, reason]
      properties:
        lineItemId: { type: string, format: uuid }
        type: { type: string, enum: [BONUS, PENALTY, DEDUCTION, MANUAL_OVERRIDE] }
        amountVnd: { type: integer, format: int64 }
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: |
            MANUAL_OVERRIDE requires ≥ 50 chars (BR-PAY-018).

    MarkPaidRequest:
      type: object
      required: [paymentReference, paymentDate]
      properties:
        paymentReference: { type: string, maxLength: 200 }
        paymentDate: { type: string, format: date }

    PayrollHistoryItem:
      type: object
      properties:
        periodId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        status: { type: string, enum: [DRAFT, REVIEWING, APPROVED, PAID, LOCKED] }
        netPayVnd: { type: integer, format: int64 }
        paidAt: { type: string, format: date-time, nullable: true }

    Payslip:
      type: object
      properties:
        periodId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dentistName: { type: string }
        lineItem:
          $ref: '#/components/schemas/PayrollLineItem'
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/PayrollAdjustment'
        encounterDetails:
          type: array
          items:
            $ref: '#/components/schemas/PayrollEncounterDetail'

    PayrollAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [BONUS, PENALTY, DEDUCTION, MANUAL_OVERRIDE] }
        amountVnd: { type: integer, format: int64 }
        reason: { type: string }
        adjustedByUserId: { type: string, format: uuid }
        adjustedAt: { type: string, format: date-time }

    PayrollEncounterDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        encounterId: { type: string, format: uuid }
        treatmentRevenueVnd: { type: integer, format: int64 }
        encounterStartAt: { type: string, format: date-time }
        encounterEndAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        treatmentBreakdown: { type: object, additionalProperties: true }

    ShiftRegistration:
      type: object
      properties:
        id: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        date: { type: string, format: date }
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        maxEncounters: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        approvedByUserId: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateShiftRegistrationRequest:
      type: object
      required: [date, startTime, endTime]
      properties:
        dentistId:
          type: string
          format: uuid
          description: Required for admin creating on behalf of dentist. Default = currentUser for BS.
        date: { type: string, format: date }
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        maxEncounters: { type: integer, nullable: true, minimum: 1 }
        notes: { type: string, maxLength: 1000 }
