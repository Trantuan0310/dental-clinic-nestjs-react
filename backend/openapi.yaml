openapi: 3.0.3
info:
  title: Dental Clinic Management API
  description: |
    REST API for Dental Clinic Management System (MVP).

    ## Authentication
    - Public endpoints: `POST /api/v1/auth/login`, `POST /api/v1/auth/forgot-password`, `POST /api/v1/auth/reset-password`
    - All other endpoints require `Authorization: Bearer <accessToken>`
    - Access token: JWT, TTL 15 minutes
    - Refresh token: httpOnly cookie, TTL 7 days, rotation enabled

    ## Conventions
    - Base URL: `/api/v1/`
    - All timestamps: ISO 8601 UTC (`2026-07-15T10:00:00Z`)
    - All monetary amounts: integer cents (e.g., `3500000` = 35,000,000 VND = 3,500,000 VND)
    - All IDs: UUID v7 strings
    - Pagination: cursor-based (`?pageSize=20&cursor=<lastId>&sort=createdAt:desc`)
    - Errors: RFC 7807 Problem Details format
    - Idempotency: `Idempotency-Key` header for POST endpoints

    ## Rate Limits
    - `/auth/login`: 5 req/min/IP
    - `/auth/forgot-password`: 3 req/min/IP
    - Authenticated read endpoints: 120 req/min/user
    - Authenticated write endpoints: 30 req/min/user
  version: 1.9.0
  # Phase 9: Payroll + ShiftRegistration added (BD-0009, BD-0010)
  contact:
    name: Dental Clinic Dev Team
    email: dev@clinic.local

servers:
  - url: https://api.clinic.local/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication & identity
  - name: Users
    description: User management (admin)
  - name: Roles
    description: Role & permission management (admin)
  - name: Audit
    description: Audit logs (admin)
  - name: Patients
    description: Patient management
  - name: Appointments
    description: Appointments, check-in, cancel, reschedule
  - name: Schedule
    description: Working schedules & time-offs
  - name: WaitingQueue
    description: FIFO waiting queue
  - name: Calendar
    description: Calendar view
  - name: Encounters
    description: Medical encounters
  - name: ClinicalNotes
    description: Clinical notes (SOAP)
  - name: Treatments
    description: Treatment plans & procedures
  - name: Prescriptions
    description: Drug prescriptions
  - name: DentalCharts
    description: Dental chart snapshots (32 teeth FDI)
  - name: Invoices
    description: Billing invoices
  - name: Payments
    description: Payment collection
  - name: Reports
    description: Revenue & outstanding reports
  - name: Inventory
    description: Inventory items & stock
  - name: InventoryCategories
    description: Inventory categories
  - name: InventoryAlerts
    description: Low-stock alerts

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from `/auth/login`

    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: httpOnly refresh token cookie

  schemas:
    # ─── Common ──────────────────────────────────────────────────────────────

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI reference to the problem type
          example: https://api.clinic.local/problems/validation-error
        title:
          type: string
          description: Short, human-readable summary
          example: Validation Error
        status:
          type: integer
          description: HTTP status code
          example: 422
        detail:
          type: string
          description: Detailed explanation
        instance:
          type: string
          format: uri
          description: Request path that caused the error
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Field name that failed validation
          example: primaryPhone
        code:
          type: string
          enum: [REQUIRED, INVALID_FORMAT, OUT_OF_RANGE, TOO_SHORT, TOO_LONG, INVALID_ENUM, DUPLICATE, BUSINESS_RULE]
          example: INVALID_FORMAT
        message:
          type: string
          example: Số điện thoại không hợp lệ

    Pagination:
      type: object
      required: [pageSize, nextCursor, hasMore]
      properties:
        pageSize:
          type: integer
          description: Number of items per page
          example: 20
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page (UUID of last item), null if no more
          example: 0191a7b0-0000-7000-8000-000000000000
        hasMore:
          type: boolean
          description: Whether there are more items after this page
          example: true

    # ─── Auth ─────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Lowercase email address
          example: admin@clinic.local
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          example: Secret123

    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, accessTokenExpiresIn, user]
          properties:
            accessToken:
              type: string
              description: JWT access token (15 min TTL)
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            accessTokenExpiresIn:
              type: integer
              description: Seconds until expiry
              example: 900
            user:
              $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required: [id, email, fullName, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
          example: 0191a7b0-0000-7000-8000-000000000001
        email:
          type: string
          format: email
          example: admin@clinic.local
        fullName:
          type: string
          example: Nguyen Van A
        status:
          type: string
          enum: [active, pending_setup, deactivated]
        roles:
          type: array
          items:
            type: string
          example: [clinic_admin]
        permissions:
          type: array
          items:
            type: string
          example: [user.create, patient.create, appointment.create]

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@clinic.local

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          format: uuid
          description: UUID reset token from email
          example: 0191a7b0-0000-7000-8000-000000000002
        newPassword:
          type: string
          format: password
          minLength: 8
          description: |
            Must contain ≥1 letter + ≥1 digit. Cannot contain email local-part. Cannot be in top 100k common passwords.
          example: NewSecret456

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    LoginHistoryEntry:
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
          example: 2026-07-13T10:00:00Z
        action:
          type: string
          enum: [login_success, login_failed, logout, logout_all, password_reset_requested, password_changed, password_reset_by_admin]
          example: login_success
        ipAddress:
          type: string
          example: 10.0.0.5
        userAgent:
          type: string
          example: Mozilla/5.0...

    # ─── Users ────────────────────────────────────────────────────────────────

    User:
      type: object
      required: [id, email, fullName, status, roles, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        status:
          type: string
          enum: [active, pending_setup, deactivated]
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        failedLoginAttempts:
          type: integer
          example: 0
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, fullName, roleIds]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        sendInvite:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active]

    UpdateUserRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid

    DeactivateUserRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          example: Resigned

    ResetUserPasswordRequest:
      type: object
      properties:
        sendEmail:
          type: boolean
          default: true

    # ─── Roles ────────────────────────────────────────────────────────────────

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: receptionist
        name:
          type: string
          example: Lễ tân
        description:
          type: string
        isSystem:
          type: boolean
        permissionCount:
          type: integer
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [code, name, permissionCodes]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,49}$'
          example: senior_dentist
        name:
          type: string
          maxLength: 100
          example: Bác sĩ cao cấp
        description:
          type: string
          maxLength: 500
        permissionCodes:
          type: array
          items:
            type: string
          example: [patient.create, patient.read, appointment.create]

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissionCodes:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        code:
          type: string
          example: patient.create
        description:
          type: string
        resource:
          type: string
          example: patient
        action:
          type: string
          example: create

    # ─── Audit ───────────────────────────────────────────────────────────────

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actorEmailAtTime:
          type: string
        action:
          type: string
          example: patient_created
        targetType:
          type: string
          nullable: true
          example: Patient
        targetId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        userAgent:
          type: string
        occurredAt:
          type: string
          format: date-time

    # ─── Patients ─────────────────────────────────────────────────────────────

    Patient:
      type: object
      required: [id, code, fullName, dateOfBirth, gender, primaryPhone, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^PAT-\d{4}-\d{5}$'
          example: PAT-2026-00045
        fullName:
          type: string
          example: Nguyen Van A
        dateOfBirth:
          type: string
          format: date
          example: 1990-05-15
        age:
          type: integer
          description: Calculated from dateOfBirth
          example: 36
        gender:
          type: string
          enum: [male, female, other]
        primaryPhone:
          type: string
          description: May be masked based on caller permission (BR-PT-021)
          example: 0987654321
        additionalPhones:
          type: array
          items:
            type: string
          example: [0912345678]
        email:
          type: string
          format: email
          nullable: true
        address:
          $ref: '#/components/schemas/Address'
        allergies:
          type: array
          items:
            type: string
          example: [Penicillin]
        medicalHistory:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          example: [VIP]
        status:
          type: string
          enum: [active, deceased, merged]
        createdByUserId:
          type: string
          format: uuid
        lastVisitAt:
          type: string
          format: date-time
          nullable: true
        mergedIntoPatientId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        line1:
          type: string
          example: 123 Nguyen Trai
        line2:
          type: string
          nullable: true
        ward:
          type: string
        district:
          type: string
        city:
          type: string
          example: TP.HCM
        country:
          type: string
          example: VN

    CreatePatientRequest:
      type: object
      required: [fullName, dateOfBirth, gender, primaryPhone, consentGiven]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        primaryPhone:
          type: string
          pattern: '^0[0-9]{9,10}$'
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        allergies:
          type: array
          items:
            type: string
        medicalHistory:
          type: string
          maxLength: 2000
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 20
        consentGiven:
          type: boolean
          description: Patient consent for data processing (BR-PT-018)

    UpdatePatientRequest:
      type: object
      properties:
        fullName:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        tags:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        medicalHistory:
          type: string

    CheckDuplicateRequest:
      type: object
      required: [primaryPhone]
      properties:
        primaryPhone:
          type: string
        fullName:
          type: string

    DuplicateCheckResponse:
      type: object
      properties:
        isExactPhoneMatch:
          type: boolean
        matches:
          type: array
          items:
            $ref: '#/components/schemas/PatientMatch'

    PatientMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
        primaryPhone:
          type: string
        matchType:
          type: string
          enum: [exact_phone, phone_and_name_exact, phone_and_name_fuzzy]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    PatientPhone:
      type: object
      properties:
        phone:
          type: string
        isPrimary:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          nullable: true
        recordedByUserId:
          type: string
          format: uuid
        note:
          type: string
          nullable: true

    AddPhoneRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
        isPrimary:
          type: boolean
          default: false
        note:
          type: string

    UpdatePrimaryPhoneRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
        note:
          type: string

    MergePatientRequest:
      type: object
      required: [intoPatientId]
      properties:
        intoPatientId:
          type: string
          format: uuid
        reassignments:
          type: object
          properties:
            appointments:
              type: boolean
              default: true
            invoices:
              type: boolean
              default: true
            encounters:
              type: boolean
              default: true
            mergePhones:
              type: boolean
              default: true
        note:
          type: string

    MergePatientResponse:
      type: object
      properties:
        mergedPatientId:
          type: string
          format: uuid
        intoPatientId:
          type: string
          format: uuid
        reassignedCounts:
          type: object
          properties:
            appointments:
              type: integer
            encounters:
              type: integer
            invoices:
              type: integer
            phones:
              type: integer

    # ─── Appointments ────────────────────────────────────────────────────────

    Appointment:
      type: object
      required: [id, patientId, dentistId, startsAt, endsAt, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientCode:
          type: string
        patientName:
          type: string
        patientPhone:
          type: string
        dentistId:
          type: string
          format: uuid
        dentistName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [scheduled, confirmed, checked_in, in_consultation, completed, cancelled, no_show]
        appointmentType:
          type: string
          enum: [consultation, treatment, follow_up]
        chiefComplaint:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        checkInAt:
          type: string
          format: date-time
          nullable: true
        checkedInByUserId:
          type: string
          format: uuid
          nullable: true
        encounterId:
          type: string
          format: uuid
          nullable: true
        rescheduledFromAppointmentId:
          type: string
          format: uuid
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelledByUserId:
          type: string
          format: uuid
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAppointmentRequest:
      type: object
      required: [patientId, dentistId, startsAt, endsAt, appointmentType]
      properties:
        patientId:
          type: string
          format: uuid
        dentistId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: Must be in the future (BR-APPT-022)
        endsAt:
          type: string
          format: date-time
        appointmentType:
          type: string
          enum: [consultation, treatment, follow_up]
        chiefComplaint:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 1000
        sendSmsReminder:
          type: boolean
          default: false

    CheckInRequest:
      type: object
      properties:
        notes:
          type: string

    CheckInResponse:
      type: object
      properties:
        appointment:
          $ref: '#/components/schemas/Appointment'
        queueEntry:
          type: object
          properties:
            queueId:
              type: string
              format: uuid
            positionInQueue:
              type: integer
            estimatedWaitMinutes:
              type: integer

    CancelAppointmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
        notifyPatient:
          type: boolean
          default: false

    RescheduleRequest:
      type: object
      required: [newStartsAt, newEndsAt]
      properties:
        newStartsAt:
          type: string
          format: date-time
        newEndsAt:
          type: string
          format: date-time
        reason:
          type: string
        notifyPatient:
          type: boolean
          default: false

    RescheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        rescheduleLog:
          type: object
          properties:
            oldStartsAt:
              type: string
              format: date-time
            newStartsAt:
              type: string
              format: date-time
            reason:
              type: string
            rescheduledByUserId:
              type: string
              format: uuid
            rescheduledAt:
              type: string
              format: date-time

    # ─── Working Schedule ────────────────────────────────────────────────────

    WorkingSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sunday, 1=Monday...
        weekdayLabel:
          type: string
          example: Thứ 2
        startTime:
          type: string
          format: time
          example: "08:00:00"
        endTime:
          type: string
          format: time
          example: "17:00:00"
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
        recurrenceType:
          type: string
          enum: [weekly]
        isActive:
          type: boolean

    CreateWorkingScheduleRequest:
      type: object
      required: [weekday, startTime, endTime, recurrenceType, validFrom]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        recurrenceType:
          type: string
          enum: [weekly]
          default: weekly
        validFrom:
          type: string
          format: date

    # ─── Time-Off ────────────────────────────────────────────────────────────

    TimeOff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
        isAllDay:
          type: boolean
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateTimeOffRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
        isAllDay:
          type: boolean
          default: true

    TimeOffWithImpact:
      allOf:
        - $ref: '#/components/schemas/TimeOff'
        - type: object
          properties:
            affectedAppointments:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  startsAt:
                    type: string
                    format: date-time
                  patientCode:
                    type: string
                  patientName:
                    type: string

    # ─── Waiting Queue ───────────────────────────────────────────────────────

    QueueEntry:
      type: object
      properties:
        queueId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        patientCode:
          type: string
        patientName:
          type: string
        patientPhone:
          type: string
        chiefComplaint:
          type: string
          nullable: true
        checkedInAt:
          type: string
          format: date-time
        positionInQueue:
          type: integer
        estimatedWaitMinutes:
          type: integer
        appointmentScheduledAt:
          type: string
          format: date-time

    QueueSummary:
      type: object
      properties:
        totalWaiting:
          type: integer
        currentlyInConsultation:
          type: integer

    # ─── Calendar ───────────────────────────────────────────────────────────

    CalendarDay:
      type: object
      properties:
        dateRange:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        appointmentsByDay:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                status:
                  type: string
                patientName:
                  type: string
                dentistName:
                  type: string
        workingSchedulesByDentist:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              properties:
                start:
                  type: string
                end:
                  type: string

    # ─── Encounters ─────────────────────────────────────────────────────────

    Encounter:
      type: object
      required: [id, patientId, dentistId, status, startedAt, isLocked]
      properties:
        id:
          type: string
          format: uuid
        patient:
          $ref: '#/components/schemas/PatientSummary'
        dentist:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
        appointmentId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [in_progress, closed, cancelled]
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        chiefComplaint:
          type: string
          nullable: true
        diagnosis:
          type: string
          nullable: true
        clinicalNote:
          $ref: '#/components/schemas/ClinicalNote'
          nullable: true
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/Treatment'
        prescriptions:
          type: array
          items:
            $ref: '#/components/schemas/Prescription'
        dentalChartSnapshotId:
          type: string
          format: uuid
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        isLocked:
          type: boolean
        lockedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PatientSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        fullName:
          type: string
        allergies:
          type: array
          items:
            type: string

    CreateEncounterRequest:
      type: object
      required: [patientId]
      properties:
        patientId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        chiefComplaint:
          type: string
        walkIn:
          type: boolean
          default: false

    CloseEncounterRequest:
      type: object
      required: [diagnosis]
      properties:
        diagnosis:
          type: string
        finalNotes:
          type: string

    CloseEncounterResponse:
      allOf:
        - $ref: '#/components/schemas/Encounter'
        - type: object
          properties:
            sideEffects:
              type: object
              properties:
                stockMovementsCreated:
                  type: integer
                invoiceDraftId:
                  type: string
                  format: uuid
                treatmentCount:
                  type: integer

    # ─── Clinical Notes ──────────────────────────────────────────────────────

    ClinicalNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        plan:
          type: string
        rawNotes:
          type: string
          nullable: true
          description: Only visible to dentist admin (BR-MR-018)
        isLocked:
          type: boolean
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertClinicalNoteRequest:
      type: object
      required: [subjective, objective, assessment, plan]
      properties:
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        plan:
          type: string
        rawNotes:
          type: string

    Addendum:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        authorName:
          type: string
        text:
          type: string
        reason:
          type: string
        addedAt:
          type: string
          format: date-time

    AddAddendumRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        reason:
          type: string

    # ─── Treatments ─────────────────────────────────────────────────────────

    Treatment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        toothNumber:
          type: integer
          minimum: 1
          maximum: 32
          description: FDI tooth numbering system
        treatmentCode:
          type: string
        treatmentName:
          type: string
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
          description: Price in cents
        currency:
          type: string
          default: VND
        quantity:
          type: integer
        lineTotalCents:
          type: integer
        inventoryItemsUsed:
          type: array
          items:
            type: object
            properties:
              inventoryItemId:
                type: string
                format: uuid
              inventoryItemName:
                type: string
              quantityUsed:
                type: integer
        performedAt:
          type: string
          format: date-time
        performedByUserId:
          type: string
          format: uuid

    CreateTreatmentRequest:
      type: object
      required: [treatmentCode, priceCents, quantity]
      properties:
        toothNumber:
          type: integer
          minimum: 1
          maximum: 32
        treatmentCode:
          type: string
        description:
          type: string
        priceCents:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        inventoryItemsUsed:
          type: array
          items:
            type: object
            required: [inventoryItemId, quantityUsed]
            properties:
              inventoryItemId:
                type: string
                format: uuid
              quantityUsed:
                type: integer
                minimum: 1

    # ─── Prescriptions ────────────────────────────────────────────────────────

    Prescription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        note:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionLine'
        issuedByUserId:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        isLocked:
          type: boolean
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionWarning'

    PrescriptionLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        drugName:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        durationDays:
          type: integer
        quantity:
          type: integer
        instructions:
          type: string
          nullable: true
        isAllergyWarning:
          type: boolean

    PrescriptionWarning:
      type: object
      properties:
        type:
          type: string
          enum: [allergy, drug_interaction]
        severity:
          type: string
          enum: [low, medium, high]
        message:
          type: string
        lineIndex:
          type: integer

    CreatePrescriptionRequest:
      type: object
      required: [lines]
      properties:
        note:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [drugName, dosage, frequency, durationDays, quantity]
            properties:
              drugName:
                type: string
                maxLength: 200
              dosage:
                type: string
                maxLength: 100
              frequency:
                type: string
                maxLength: 200
              durationDays:
                type: integer
                minimum: 1
                maximum: 30
              quantity:
                type: integer
                minimum: 1
              instructions:
                type: string

    # ─── Dental Chart ────────────────────────────────────────────────────────

    DentalChartSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        snapshot:
          type: object
          properties:
            teeth:
              type: object
              additionalProperties:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, cavity, filled, crowned, missing, implant, extraction_needed]
                  notes:
                    type: string
                    maxLength: 200
            schemaVersion:
              type: string
              default: "1.0"
            capturedAt:
              type: string
              format: date-time
        capturedByUserId:
          type: string
          format: uuid

    UpdateDentalChartRequest:
      type: object
      required: [teeth]
      properties:
        teeth:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [healthy, cavity, filled, crowned, missing, implant, extraction_needed]
              notes:
                type: string
                maxLength: 200
          description: Must include all 32 teeth (FDI numbering 1-32)

    # ─── Invoices ───────────────────────────────────────────────────────────

    Invoice:
      type: object
      required: [id, code, patientId, status, totalAmountCents, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^INV-\d{4}-\d{5}$'
          example: INV-2026-00123
        patient:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            fullName:
              type: string
            primaryPhone:
              type: string
        encounterId:
          type: string
          format: uuid
          nullable: true
        encounterSummary:
          type: object
          nullable: true
          properties:
            occurredAt:
              type: string
              format: date-time
            chiefComplaint:
              type: string
        status:
          type: string
          enum: [draft, issued, partial, paid, void]
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        subtotalCents:
          type: integer
        discountCents:
          type: integer
        totalAmountCents:
          type: integer
        paidAmountCents:
          type: integer
        outstandingAmountCents:
          type: integer
        currency:
          type: string
          default: VND
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        issuedAt:
          type: string
          format: date-time
          nullable: true
        issuedByUserId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        voidedAt:
          type: string
          format: date-time
          nullable: true
        voidReason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        treatmentId:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        toothNumber:
          type: integer
          nullable: true
        quantity:
          type: integer
        unitPriceCents:
          type: integer
        lineTotalCents:
          type: integer

    CreateInvoiceRequest:
      type: object
      required: [patientId, items]
      properties:
        patientId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required: [description, quantity, unitPriceCents]
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPriceCents:
                type: integer
                minimum: 0
        notes:
          type: string

    IssueInvoiceRequest:
      type: object
      properties:
        note:
          type: string

    VoidInvoiceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        adminPassword:
          type: string

    # ─── Payments ────────────────────────────────────────────────────────────

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        amountCents:
          type: integer
        method:
          type: string
          enum: [cash, bank_transfer, card, e_wallet]
        currency:
          type: string
          default: VND
        receivedAt:
          type: string
          format: date-time
        receivedByUserId:
          type: string
          format: uuid
        receivedByName:
          type: string
        referenceNumber:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    CreatePaymentRequest:
      type: object
      required: [amountCents, method]
      properties:
        amountCents:
          type: integer
          minimum: 1
          description: Must be ≤ outstanding amount
        method:
          type: string
          enum: [cash, bank_transfer, card, e_wallet]
        paidAt:
          type: string
          format: date-time
          default: now
        referenceNumber:
          type: string
          maxLength: 100
        note:
          type: string

    ReversePaymentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        adminPassword:
          type: string

    # ─── Reports ─────────────────────────────────────────────────────────────

    RevenueReport:
      type: object
      properties:
        dateRange:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        byGroup:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
              totalInvoicedCents:
                type: integer
              totalCollectedCents:
                type: integer
              totalOutstandingCents:
                type: integer
              invoiceCount:
                type: integer
              paymentCount:
                type: integer
        summary:
          type: object
          properties:
            totalInvoicedCents:
              type: integer
            totalCollectedCents:
              type: integer
            outstandingCents:
              type: integer

    OutstandingReport:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              invoiceId:
                type: string
                format: uuid
              invoiceCode:
                type: string
              patientCode:
                type: string
              patientName:
                type: string
              patientPhone:
                type: string
              outstandingAmountCents:
                type: integer
              daysOutstanding:
                type: integer
              issuedAt:
                type: string
                format: date
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Inventory ───────────────────────────────────────────────────────────

    InventoryCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        itemCount:
          type: integer
        lowStockItemCount:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,29}$'
        name:
          type: string
          maxLength: 100
        description:
          type: string
        parentId:
          type: string
          format: uuid

    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        unit:
          type: string
        quantityOnHand:
          type: integer
        reservedQuantity:
          type: integer
        availableQuantity:
          type: integer
        reorderPoint:
          type: integer
        reorderQuantity:
          type: integer
        costPerUnitCents:
          type: integer
        currency:
          type: string
          default: VND
        isLowStock:
          type: boolean
        isActive:
          type: boolean
        lastMovementAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateInventoryItemRequest:
      type: object
      required: [sku, name, unit, categoryId]
      properties:
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        unit:
          type: string
          maxLength: 20
        reorderPoint:
          type: integer
          minimum: 0
          default: 10
        reorderQuantity:
          type: integer
          minimum: 0
          default: 50
        costPerUnitCents:
          type: integer
          minimum: 0
        initialQuantityOnHand:
          type: integer
          minimum: 0
          default: 0
        isActive:
          type: boolean
          default: true

    StockMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [in, out, adjust]
        quantity:
          type: integer
          description: Negative for out/adjust reducing stock
        quantityBefore:
          type: integer
        quantityAfter:
          type: integer
        reason:
          type: string
          enum: [initial_stock, treatment_consumption, stock_in, broken, lost, count_correction, returned_to_supplier, received_from_supplier]
        note:
          type: string
          nullable: true
        relatedEncounterId:
          type: string
          format: uuid
          nullable: true
        relatedTreatmentId:
          type: string
          format: uuid
          nullable: true
        performedByUserId:
          type: string
          format: uuid
        performedAt:
          type: string
          format: date-time

    AdjustStockRequest:
      type: object
      required: [deltaQuantity, reason]
      properties:
        deltaQuantity:
          type: integer
          description: Positive = increase stock, Negative = decrease. Must be non-zero.
          example: -3
        reason:
          type: string
          enum: [stock_in, broken, lost, count_correction, returned_to_supplier, received_from_supplier]
        note:
          type: string
        relatedEncounterId:
          type: string
          format: uuid

    AdjustStockResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
        movement:
          $ref: '#/components/schemas/StockMovement'
        noop:
          type: boolean
          description: True if deltaQuantity was zero and no change was made (BR-INV-023)

    InventoryAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [low_stock, critical_stock, out_of_stock]
        severity:
          type: string
          enum: [low, critical, out]
        itemId:
          type: string
          format: uuid
        itemSku:
          type: string
        itemName:
          type: string
        currentQuantity:
          type: integer
        threshold:
          type: integer
        triggeredAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedByUserId:
          type: string
          format: uuid
          nullable: true

    AcknowledgeAlertRequest:
      type: object
      properties:
        note:
          type: string

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=xxx; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "429":
          description: Account temporarily locked (too many failed attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh token cookie
      security:
        - RefreshTokenCookie: []
      responses:
        "200":
          description: Token refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Refresh token invalid, expired, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session (revoke refresh token)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout all sessions (revoke all refresh tokens)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: All sessions logged out

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset link (always returns 204 even if email not found)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "204":
          description: If email exists, reset link is sent. Always returns 204.

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        "400":
          description: Token invalid/expired/used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserInfo'

  /auth/me/login-history:
    get:
      tags: [Auth]
      summary: Get current user's login history
      security:
        - BearerAuth: []
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor (UUID of last entry)
        - name: sort
          in: query
          schema:
            type: string
            default: occurredAt:desc
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginHistoryEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password (requires current password)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "204":
          description: Password changed, all refresh tokens revoked
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # ── Admin Users ────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [Users]
      summary: List all users (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: q
