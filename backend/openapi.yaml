          description: Patient not found
    patch:
      tags: [Patients]
      summary: Update patient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        "200":
          description: Patient updated
        "409":
          description: Phone conflict
