  # ── Patients ──────────────────────────────────────────────────────────────

  /patients:
    get:
      tags: [Patients]
      summary: List patients (search + filter)
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deceased, merged]
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female, other]
        - name: from
          in: query
          description: Birthdate range start
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt:desc
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Patient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Patients]
      summary: Create new patient
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
          description: Required for idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
                  meta:
                    type: object
                    properties:
                      codeGenerated:
                        type: string
        "409":
          description: Primary phone already belongs to another patient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      duplicateCandidate:
                        $ref: '#/components/schemas/PatientMatch'
        "422":
          description: Validation error (e.g., consent not given)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

