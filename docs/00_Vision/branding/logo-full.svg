<!--
  GENSMILE  Logo (full, light bg)
  - Icon: stylized tooth + 2 sparkle stars (cosmetic dentistry cue)
  - Wordmark: GENSMILE (bold, all caps)
  - Tagline: "Nha khoa th©m mù" (italic, decorative diacritic)

  Single source of truth for the brand. Use srcset / variants from React Logo.tsx.
  viewBox: 480 x 200  preserves the aspect ratio used in the source mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="GENSMILE  Nha khoa th©m mù">
  <defs>
    <style>
      .tooth-fill   { fill: #2BA3A0; }
      .tooth-stroke { fill: none; stroke: #1B7A78; stroke-width: 3; stroke-linejoin: round; }
      .sparkle       { fill: #F4B860; }   /* warm amber sparkle, matches logotype accent */
      .wordmark      { fill: #1B7A78; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 4px; }
      .tagline       { fill: #1B7A78; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- ============= ICON BLOCK (left, 0..180) ============= -->
  <g transform="translate(10,30)">
    <!-- Stylized tooth: molar shape, divided into top crown + two roots -->
    <!-- Outer tooth silhouette -->
    <path class="tooth-fill"
          d="M 30 0
             C 55 0, 75 5, 85 25
             C 92 40, 90 60, 82 80
             C 76 95, 70 110, 60 122
             C 52 132, 42 134, 36 124
             C 30 116, 28 102, 28 90
             C 26 95, 24 102, 22 110
             C 19 122, 14 134, 8 124
             C 0 112, -2 92, -2 80
             C -2 60, 0 40, 8 25
             C 18 5, 5 0, 30 0 Z"
          transform="translate(40,10) scale(1.5)"/>

    <!-- Inner highlight curve (gives 3D feel) -->
    <path d="M 55 35
             C 70 50, 70 70, 60 95"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

    <!-- Decorative sparkle 1 (top-left of icon) -->
    <g transform="translate(8,12)">
      <path class="sparkle"
            d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"/>
    </g>

    <!-- Decorative sparkle 2 (smaller, bottom-right of icon) -->
    <g transform="translate(150,120) scale(0.65)">
      <path class="sparkle"
            d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"/>
    </g>
  </g>

  <!-- ============= WORDMARK + TAGLINE (right, 200..460) ============= -->
  <g transform="translate(200,90)">
    <text class="wordmark" x="0" y="0">GENSMILE</text>
    <!-- Tagline with decorative accent dot above "ù"  using a small sparkle glyph -->
    <text class="tagline" x="0" y="36">
      Nha khoa th<tspan dy="-6">©</tspan><tspan dy="6">m m</tspan><tspan dy="-6">ù</tspan>
    </text>
    <!-- Tiny accent sparkle next to tagline -->
    <g transform="translate(220,28) scale(0.4)">
      <path fill="#F4B860"
            d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"/>
    </g>
  </g>
</svg>
